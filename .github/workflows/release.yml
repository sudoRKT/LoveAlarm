name: Release

# Builds a signed release APK.
# Push a tag like v1.0.0, or publish a Release with a new tag from the GitHub website, and this attaches
# LoveAlarm-v1.0.0.apk (plus its sha256) to that GitHub Release (creating it if it does not exist yet).
# Running it by hand (Actions tab -> Release -> Run workflow) builds the same APK as a downloadable
# artifact but does not publish a Release.
# Needs five repository secrets: GOOGLE_SERVICES_JSON, KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version label
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="manual-${COMMIT_SHA:0:7}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Version label: $TAG"

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::The GOOGLE_SERVICES_JSON secret is empty or missing. A release APK without the real Firebase config cannot send or receive alerts. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is empty or missing. Paste the contents of lovealarm-release.jks.base64.txt into it."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::KEYSTORE_BASE64 did not decode to a keystore file. Re-copy the whole line from lovealarm-release.jks.base64.txt."
            exit 1
          fi

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is empty or missing."
              exit 1
            fi
          done
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode=summary

      - name: Check the APK is signed
        run: |
          OUT=app/build/outputs/apk/release
          if [ ! -f "$OUT/app-release.apk" ]; then
            if [ -f "$OUT/app-release-unsigned.apk" ]; then
              echo "::error::Gradle produced app-release-unsigned.apk, which means signing was skipped. app/build.gradle.kts only signs when KEYSTORE_FILE points to a real file and KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD are all set. Check the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets."
            else
              echo "::error::No release APK found in $OUT."
            fi
            ls -la "$OUT" || true
            exit 1
          fi

      - name: Rename and checksum
        run: |
          APK="LoveAlarm-$TAG.apk"
          mv app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: LoveAlarm-${{ env.TAG }}
          path: |
            LoveAlarm-${{ env.TAG }}.apk
            LoveAlarm-${{ env.TAG }}.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          Love Alarm $TAG

          To install or update: download LoveAlarm-$TAG.apk below on your Android phone and open it.
          Installing over an older version keeps your tiles and pairing.

          Full instructions: https://github.com/$GITHUB_REPOSITORY#readme
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; attaching the APK to it."
            gh release upload "$TAG" "LoveAlarm-$TAG.apk" "LoveAlarm-$TAG.apk.sha256" --clobber
            gh release edit "$TAG" --title "Love Alarm $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "LoveAlarm-$TAG.apk" "LoveAlarm-$TAG.apk.sha256" \
              --title "Love Alarm $TAG" \
              --notes-file release-notes.md
          fi

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" app/google-services.json
